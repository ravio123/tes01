<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Modern</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loadingScreen">

    <div class="topbar">
        <div class="avatar shimmer"></div>

        <div class="top-icons">
            <div class="icon shimmer"></div>
            <div class="icon shimmer"></div>
            <div class="profile shimmer"></div>
        </div>
    </div>

    <div class="search shimmer"></div>

    <div class="menu-card">
        <div class="menu-item">
            <div class="title shimmer"></div>
            <div class="subtitle shimmer"></div>
            <div class="thumb shimmer"></div>
        </div>

        <div class="menu-item">
            <div class="title shimmer"></div>
            <div class="subtitle shimmer"></div>
            <div class="thumb shimmer"></div>
        </div>

        <div class="menu-item">
            <div class="title shimmer"></div>
            <div class="subtitle shimmer"></div>
            <div class="thumb shimmer"></div>
        </div>
    </div>

    <div class="banner shimmer"></div>

    <div class="circle-row">
        <div class="circle shimmer"></div>
        <div class="circle shimmer"></div>
        <div class="circle shimmer"></div>
        <div class="circle shimmer"></div>
        <div class="circle shimmer"></div>
    </div>

    <div class="btn-row">
        <div class="btn shimmer"></div>
        <div class="btn shimmer"></div>
    </div>

    <div class="grid">
        <div class="card shimmer"></div>
        <div class="card shimmer"></div>
        <div class="card shimmer"></div>
    </div>

</div>

<div id="appContent" style="display:none;">
    <h1></h1>
</div>

<script src="script.js"></script>
</body>
</html>
